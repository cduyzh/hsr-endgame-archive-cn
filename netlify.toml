[build]
  command = "pnpm build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

# 域名级重定向：旧 netlify.app 子域名收口到自定义域名。
# 必须排在 /* SPA 兜底规则之前——Netlify 按顺序匹配，兜底规则会先命中同域请求。
[[redirects]]
  from = "https://hsr-endgame-archive-cn.netlify.app/*"
  to = "https://hsr-archive.cduyzh.top/:splat"
  status = 301
  force = true

# 游戏数据与图片仍由前端直连数据源（static.nanoka.cc），本站不代理、不落盘；
# 唯一例外是敌方阶段静态快照（/api/archive/stages）——它需要 38 个上游请求，
# 改由函数算一次并交给边缘缓存复用，前端拿不到时仍回落浏览器直连。

[[redirects]]
  from = "/api/archive/config"
  to = "/.netlify/functions/archive-config"
  status = 200

[[redirects]]
  from = "/api/archive/stages"
  to = "/.netlify/functions/archive-stages"
  status = 200

[[redirects]]
  from = "/api/archive/runs"
  to = "/.netlify/functions/archive-runs"
  status = 200

[[redirects]]
  from = "/api/archive/stats"
  to = "/.netlify/functions/archive-stats"
  status = 200

[[redirects]]
  from = "/api/submissions"
  to = "/.netlify/functions/submissions"
  status = 200

[[redirects]]
  from = "/api/submissions/check"
  to = "/.netlify/functions/submissions-check"
  status = 200

[[redirects]]
  from = "/api/submissions/me"
  to = "/.netlify/functions/submissions-me"
  status = 200

[[redirects]]
  from = "/api/submissions/:id/withdraw"
  to = "/.netlify/functions/submissions-withdraw/:id"
  status = 200

[[redirects]]
  from = "/api/submissions/:id/visibility"
  to = "/.netlify/functions/submissions-visibility/:id"
  status = 200

[[redirects]]
  from = "/api/submissions/:id/delete"
  to = "/.netlify/functions/submissions-delete/:id"
  status = 200

[[redirects]]
  from = "/api/submissions/:id/revisions"
  to = "/.netlify/functions/submissions-revision/:id"
  status = 200

[[redirects]]
  from = "/api/admin/submissions"
  to = "/.netlify/functions/admin-submissions"
  status = 200

[[redirects]]
  from = "/api/admin/submissions/:id"
  to = "/.netlify/functions/admin-submissions-id/:id"
  status = 200

[[redirects]]
  from = "/api/admin/sync-stages"
  to = "/.netlify/functions/admin-sync-stages"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
